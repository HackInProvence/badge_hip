# CTFd pour le badge SecSea (petit événement : SQLite, un seul conteneur).
# Lancer :  docker compose -f ctfd/docker-compose.yml up -d
# Puis ouvrir http://localhost:8000, faire l'assistant (nom de l'événement, compte admin),
# et importer les épreuves :  voir ctfd/README.md.
#
# Pour un gros événement, préférer la compose officielle de CTFd (MariaDB + Redis).

services:
  ctfd:
    image: ctfd/ctfd:3.7.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - LOG_FOLDER=/var/log/CTFd
      - DATABASE_URL=sqlite:////var/uploads/ctfd.db  # base persistée dans le volume ci-dessous
      - WORKERS=1
    volumes:
      - ./data:/var/uploads
      - ./logs:/var/log/CTFd
