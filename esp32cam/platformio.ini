;
; The firmware of the camera module of the badge: an ESP32-CAM (AI-Thinker, OV2640, 4 MB PSRAM) on the port J2.
; Build:  pio run              (in this folder)
; Flash:  pio run -t upload --upload-port COMx   (the ESP32-CAM on its programmer, GPIO0 to ground at the reset:
;         docs/fr/appareil_photo.md)
; The link with the badge (src/shared/camlink) is shared with the firmware of the badge.

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino
monitor_speed = 921600
upload_speed = 460800
lib_extra_dirs = ../src/shared
lib_deps = camlink
build_flags =
    -DCORE_DEBUG_LEVEL=0          ; Nothing else on the UART0: it is the link with the badge
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.partitions = huge_app.csv
